<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>matchboxdropgame</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2b2420; font-family: "Segoe UI", Arial, sans-serif; user-select: none; -webkit-user-select: none; }
  #game { position: fixed; inset: 0; touch-action: none; cursor: grab; }
  #game:active { cursor: grabbing; }

  #score {
    position: fixed; top: 12px; right: 12px; min-width: 110px; padding: 7px 11px;
    background: rgba(20, 16, 14, .78); border: 1.5px solid #f2d214; border-radius: 9px;
    color: #fff; text-align: right; box-shadow: 0 6px 20px rgba(0,0,0,.4);
  }
  #score .lbl { font-size: 9px; letter-spacing: 1.5px; color: #f2d214; font-weight: 700; }
  #score .val { font-size: 26px; font-weight: 900; line-height: 1.05; font-variant-numeric: tabular-nums; }
  #score .meta { font-size: 10px; color: #ccc; margin-top: 2px; }
  #score button {
    margin-top: 5px; background: transparent; color: #aaa; border: 1px solid #555; border-radius: 5px;
    font-size: 9.5px; padding: 2px 7px; cursor: pointer;
  }
  #score button:hover { color: #fff; border-color: #f2d214; }

  #popup {
    position: fixed; top: 22%; left: 50%; transform: translate(-50%, -50%) scale(.6); opacity: 0;
    font-size: 54px; font-weight: 900; color: #fff; text-align: center; pointer-events: none;
    text-shadow: 0 4px 0 #5a1620, 0 0 30px rgba(0,0,0,.6); transition: transform .35s cubic-bezier(.2,1.6,.4,1), opacity .35s;
  }
  #popup small { display: block; font-size: 18px; letter-spacing: 3px; color: #f2d214; text-shadow: 0 2px 0 #000; }
  #popup.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }

  #hint {
    position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%); text-align: center;
    color: #fff; font-weight: 700; font-size: 16px; letter-spacing: 1px; pointer-events: none;
    text-shadow: 0 2px 6px #000; transition: opacity .3s;
  }
  #hint .arrow { display: block; font-size: 34px; color: #f2d214; animation: bob 1.1s ease-in-out infinite; }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  #hint.hide { opacity: 0; }

  #power {
    position: fixed; left: 22px; bottom: 30px; width: 16px; height: 180px; border-radius: 8px;
    background: rgba(0,0,0,.45); border: 2px solid rgba(255,255,255,.4); overflow: hidden;
    opacity: 0; transition: opacity .15s; pointer-events: none;
  }
  #power.on { opacity: 1; }
  #power div { position: absolute; inset: 0; transform: scaleY(0); transform-origin: bottom; will-change: transform;
    background: linear-gradient(0deg, #f2d214, #ff7a3c, #d42a2a); }

  #rules {
    position: fixed; top: 12px; left: 12px; padding: 6px 10px; border-radius: 8px;
    background: rgba(20,16,14,.7); color: #ddd; font-size: 10px; line-height: 1.5;
  }
  #rules b { color: #f2d214; }
  #rules .t { font-weight: 800; color: #fff; font-size: 11px; margin-bottom: 1px; }

  #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 18px; }
</style>
</head>
<body>
<div id="game"></div>
<div id="loading">Loading…</div>

<div id="rules">
  <div class="t">matchboxdropgame</div>
  Lands flat (wide side) &nbsp;<b>0</b><br>
  Lands on striker side &nbsp;<b>50</b><br>
  Stands on white end &nbsp;<b>100</b>
</div>

<div id="score">
  <div class="lbl">SCORE</div>
  <div class="val" id="total">0</div>
  <div class="meta">Throws: <span id="throws">0</span> · Last: <span id="last">–</span></div>
  <div class="meta">Best throw: <span id="best">0</span></div>
  <button id="mute">🔊 Sound</button> <button id="reset">Reset score</button>
</div>

<div id="popup"></div>
<div id="hint"><span class="arrow">⬆</span>Swipe up to throw the matchbox</div>
<div id="power"><div id="powerFill"></div></div>

<script type="module">
import * as THREE from 'three';
import * as CANNON from 'cannon-es';

/* =========================================================
   Matchbox face artwork (drawn with canvas, dummy details)
   ========================================================= */
const MAROON = '#5a1620', MAROON_DK = '#3d0d14', YELLOW = '#f2d214', RED = '#d42a2a';
const PX = 2; // texture pixels per design unit

function makeCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = w * PX; c.height = h * PX;
  const g = c.getContext('2d');
  g.scale(PX, PX);
  return [c, g];
}
function rr(g, x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r); }

function drawFront() {                       // wide face: maroon label (320 × 540)
  const [c, g] = makeCanvas(320, 540);
  g.fillStyle = MAROON; g.fillRect(0, 0, 320, 540);
  let rg = g.createRadialGradient(224, 216, 0, 224, 216, 300);
  rg.addColorStop(0, 'rgba(255,90,60,.25)'); rg.addColorStop(1, 'rgba(255,90,60,0)');
  g.fillStyle = rg; g.fillRect(0, 0, 320, 540);

  // content laid out sideways (reads bottom → top)
  g.save();
  g.translate(160, 270); g.rotate(-Math.PI / 2); g.translate(-270, -160);

  for (let i = 0; i < 140; i++) {           // sparkles
    const a = Math.random() * Math.PI * 2, r = Math.random() * 190;
    g.fillStyle = Math.random() < .5 ? 'rgba(255,200,120,.8)' : 'rgba(255,140,100,.6)';
    g.beginPath(); g.arc(400 + Math.cos(a) * r, 150 + Math.sin(a) * r, Math.random() * 1.4 + .4, 0, 7); g.fill();
  }
  g.save();                                   // glowing rings
  g.shadowColor = 'rgba(255,120,60,.9)'; g.shadowBlur = 30; g.lineCap = 'round';
  g.lineWidth = 12;
  g.strokeStyle = '#ffc04d'; g.beginPath(); g.arc(395, 155, 158, Math.PI * 0.95, Math.PI * 1.85); g.stroke();
  g.strokeStyle = '#ff6a3d'; g.beginPath(); g.arc(395, 155, 158, Math.PI * 1.85, Math.PI * 2.3); g.stroke();
  g.lineWidth = 4; g.strokeStyle = 'rgba(255,220,150,.8)';
  g.beginPath(); g.arc(395, 160, 138, Math.PI * 1.0, Math.PI * 2.2); g.stroke();
  g.restore();

  g.textAlign = 'center'; g.textBaseline = 'alphabetic';
  g.fillStyle = YELLOW; g.font = '800 17px "Segoe UI", Arial, sans-serif';
  if ('letterSpacing' in g) g.letterSpacing = '2.5px';
  g.fillText('LIGHTS EASY  •  BURNS STEADY', 270, 36);
  if ('letterSpacing' in g) g.letterSpacing = '0px';

  // brand: matchbox + drop
  g.textAlign = 'left';
  g.font = '900 54px "Arial Black", "Segoe UI Black", Arial, sans-serif';
  const x0 = 24, y0 = 150, w1 = g.measureText('matchbox').width;
  const layer = (t, x, cols) => cols.forEach(([col, o]) => { g.fillStyle = col; g.fillText(t, x + o, y0 + o); });
  layer('matchbox', x0, [[MAROON_DK, 6], [YELLOW, 3], ['#fff', 0]]);
  layer('drop', x0 + w1, [[MAROON_DK, 6], ['#fff', 3], [YELLOW, 0]]);

  // badge: game
  g.save();
  g.translate(395, 232); g.rotate(-8 * Math.PI / 180);
  g.font = '900 44px "Arial Black", Arial, sans-serif';
  const bw = g.measureText('game').width + 40, bh = 60;
  const tail = g.createLinearGradient(-bw / 2 - 80, 0, -bw / 2, 0);
  tail.addColorStop(0, YELLOW); tail.addColorStop(.5, '#ff8a3c'); tail.addColorStop(1, RED);
  g.fillStyle = tail;
  g.beginPath(); g.moveTo(-bw / 2 - 80, 22); g.quadraticCurveTo(-bw / 2 - 40, 0, -bw / 2 + 5, 6);
  g.lineTo(-bw / 2 + 5, 34); g.quadraticCurveTo(-bw / 2 - 40, 36, -bw / 2 - 80, 22); g.fill();
  [['rgba(0,0,0,.3)', 15, 6, 8], [YELLOW, 15, 0, 0], [RED, 10, 0, 0], ['#ff8a3c', 5, 0, 0], ['#8d1d2b', 0, 0, 0]]
    .forEach(([col, e, ox, oy]) => { g.fillStyle = col; rr(g, -bw / 2 - e + ox, -bh / 2 - e + oy, bw + e * 2, bh + e * 2, 14 + e); g.fill(); });
  g.fillStyle = '#fff'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText('game', 0, 2);
  g.restore();

  // logo
  g.strokeStyle = g.fillStyle = '#e9d9c6'; g.lineWidth = 2; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.beginPath(); g.arc(478, 262, 17, 0, 7); g.stroke();
  g.font = '800 10px "Segoe UI", Arial'; g.fillText('MDG', 478, 263);
  g.font = '600 8px "Segoe UI", Arial'; g.fillText('MATCHBOXDROPGAME', 478, 293);
  g.restore();

  const sheen = g.createLinearGradient(0, 0, 320, 540);
  sheen.addColorStop(0, 'rgba(255,255,255,.10)'); sheen.addColorStop(.4, 'rgba(255,255,255,0)'); sheen.addColorStop(1, 'rgba(0,0,0,.18)');
  g.fillStyle = sheen; g.fillRect(0, 0, 320, 540);
  return c;
}

function drawBack() {                        // wide face: yellow info panel (320 × 540)
  const [c, g] = makeCanvas(320, 540);
  g.fillStyle = YELLOW; g.fillRect(0, 0, 320, 540);
  g.strokeStyle = RED; g.lineWidth = 3; g.strokeRect(13.5, 13.5, 293, 513);

  const circle = (cx, cy, draw) => {
    g.save();
    g.beginPath(); g.arc(cx, cy, 56, 0, 7); g.fillStyle = '#f7f4ea'; g.fill();
    g.clip(); draw(); g.restore();
    g.beginPath(); g.arc(cx, cy, 56, 0, 7); g.strokeStyle = '#222'; g.lineWidth = 3; g.stroke();
  };
  const stick = (x, y, w, h, rot = 0, lw = 3) => {
    g.save(); g.translate(x, y); g.rotate(rot);
    g.fillStyle = '#f0b65a'; g.strokeStyle = '#e2365b'; g.lineWidth = lw;
    g.fillRect(-w / 2, -h, w, h); g.strokeRect(-w / 2, -h, w, h); g.restore();
  };
  const head = (x, y, rx, ry, ring = 4) => {
    g.beginPath(); g.ellipse(x, y, rx, ry, 0, 0, 7); g.fillStyle = '#2a1416'; g.fill();
    if (ring) { g.strokeStyle = '#e2365b'; g.lineWidth = ring; g.stroke(); }
  };
  circle(92, 92, () => {
    stick(78, 145, 16, 72); head(78, 64, 13, 15);
    stick(118, 140, 9, 36, .2, 2); head(124, 101, 7, 8, 2);
  });
  g.fillStyle = '#222'; g.fillRect(159, 34, 2, 118);
  circle(228, 92, () => {
    stick(212, 145, 16, 80); head(212, 58, 13, 15);
    stick(252, 145, 6, 50, 0, 1); head(252, 92, 5, 6, 0);
  });

  g.fillStyle = '#222'; g.textAlign = 'center'; g.textBaseline = 'alphabetic';
  g.font = '900 15px "Segoe UI", Arial';
  [['STRONG HEAD,', 'NO BREAKS', 92], ['LONG STICKS', 'FOR SAFETY', 228]]
    .forEach(([a, b, x]) => { g.fillText(a, x, 183); g.fillText(b, x, 201); });

  const lines = [
    ['600 15px', '50 Safety Matches'], ['13px', 'MRP ₹0.00 incl. of all taxes'], ['13px', '₹0.00 per stick'], null,
    ['13px', 'Mfd. by: Manufacturer Name,'], ['13px', 'City Name - 000 000.'], null,
    ['13px', 'Mktd. by: matchboxdropgame,'], ['13px', 'Street Address,'], ['13px', 'City Name - 000 000.'], null,
    ['13px', 'For feedback, contact Customer Care'], ['13px', '☎ 1800 000 0000  ✉ hello@example.com'],
  ];
  let y = 236;
  for (const l of lines) {
    if (!l) { y += 8; continue; }
    g.font = l[0] + ' "Segoe UI", Arial'; g.fillText(l[1], 152, y); y += 20;
  }
  g.save(); g.translate(291, 268); g.rotate(-Math.PI / 2);
  g.strokeStyle = '#222'; g.lineWidth = 2; g.strokeRect(-40, -10, 80, 20);
  g.font = '700 11px "Segoe UI", Arial'; g.textBaseline = 'middle'; g.fillText('MFD: 00/00', 0, 1);
  g.restore();
  return c;
}

function drawStriker() {                     // narrow long side: striker (540 × 145)
  const [c, g] = makeCanvas(540, 145);
  g.fillStyle = YELLOW; g.fillRect(0, 0, 540, 145);
  g.save();
  g.beginPath(); g.rect(14, 14, 512, 117); g.clip();
  g.fillStyle = '#6d1c2a'; g.fillRect(14, 14, 512, 117);
  g.strokeStyle = '#f4efe4'; g.lineWidth = 2.6;
  for (let d = -200; d < 760; d += 9) {
    g.beginPath(); g.moveTo(d, 0); g.lineTo(d + 145, 145); g.stroke();
    g.beginPath(); g.moveTo(d + 145, 0); g.lineTo(d, 145); g.stroke();
  }
  g.restore();
  g.strokeStyle = '#f4efe4'; g.lineWidth = 3; g.strokeRect(15.5, 15.5, 509, 114);
  return c;
}

function drawEnd() {                         // short end: white tray inside sleeve (320 × 145)
  const [c, g] = makeCanvas(320, 145);
  g.fillStyle = '#ecebe6'; g.fillRect(0, 0, 320, 145);
  for (let i = 0; i < 2500; i++) {
    g.fillStyle = `rgba(${Math.random() < .5 ? '0,0,0' : '255,255,255'},${Math.random() * .06})`;
    g.fillRect(Math.random() * 320, Math.random() * 145, 1.5, 1.5);
  }
  const sh = g.createLinearGradient(0, 0, 0, 145);
  sh.addColorStop(0, 'rgba(0,0,0,.18)'); sh.addColorStop(.15, 'rgba(0,0,0,0)');
  sh.addColorStop(.85, 'rgba(0,0,0,0)'); sh.addColorStop(1, 'rgba(0,0,0,.18)');
  g.fillStyle = sh; g.fillRect(0, 0, 320, 145);
  g.fillStyle = MAROON; g.fillRect(0, 0, 320, 6);       // top board edge (label side)
  g.fillStyle = YELLOW; g.fillRect(0, 139, 320, 6); g.fillRect(0, 0, 6, 145); g.fillRect(314, 0, 6, 145);
  return c;
}

function drawBricks() {                      // 512 x 480 tile = 4 bricks x 10 rows (tiles seamlessly)
  const c = document.createElement('canvas'); c.width = 512; c.height = 480;
  const g = c.getContext('2d');
  g.fillStyle = '#8a8378'; g.fillRect(0, 0, 512, 480);              // mortar
  const bw = 128, bh = 48, m = 5;
  const hl = g.createLinearGradient(0, 0, 0, bh);
  hl.addColorStop(0, 'rgba(255,255,255,.08)'); hl.addColorStop(1, 'rgba(0,0,0,.15)');
  for (let row = 0; row < 10; row++) {
    const off = row % 2 ? bw / 2 : 0, y = row * bh;
    for (let col = -1; col < 5; col++) {
      const x = col * bw + off;
      g.fillStyle = `hsl(${10 + Math.random() * 14},${40 + Math.random() * 18}%,${26 + Math.random() * 14}%)`;
      g.fillRect(x + m / 2, y + m / 2, bw - m, bh - m);
      g.save(); g.translate(0, y); g.fillStyle = hl; g.fillRect(x + m / 2, m / 2, bw - m, bh - m); g.restore();
    }
  }
  g.fillStyle = 'rgba(0,0,0,.07)';                                   // brick grain, batched
  for (let i = 0; i < 2500; i++) g.fillRect(Math.random() * 512, Math.random() * 480, 2, 2);
  g.fillStyle = 'rgba(255,220,200,.06)';
  for (let i = 0; i < 2500; i++) g.fillRect(Math.random() * 512, Math.random() * 480, 2, 2);
  return c;
}

function drawFloor() {
  const c = document.createElement('canvas'); c.width = c.height = 512;
  const g = c.getContext('2d');
  g.fillStyle = '#7d7d7a'; g.fillRect(0, 0, 512, 512);
  const d = g.getImageData(0, 0, 512, 512);
  for (let i = 0; i < d.data.length; i += 4) {
    const n = (Math.random() - .5) * 26;
    d.data[i] += n; d.data[i + 1] += n; d.data[i + 2] += n;
  }
  g.putImageData(d, 0, 0);
  for (let i = 0; i < 40; i++) {             // soft blotches
    g.fillStyle = `rgba(${Math.random() < .5 ? '0,0,0' : '255,255,255'},.035)`;
    g.beginPath(); g.arc(Math.random() * 512, Math.random() * 512, 20 + Math.random() * 60, 0, 7); g.fill();
  }
  return c;
}

/* =========================================================
   Scene
   ========================================================= */
const container = document.getElementById('game');
const isMobile = matchMedia('(pointer: coarse)').matches;
const DPR = Math.min(devicePixelRatio || 1, isMobile ? 1.5 : 2);
const renderer = new THREE.WebGLRenderer({ antialias: DPR < 2, powerPreference: 'high-performance', stencil: false });
renderer.setPixelRatio(DPR);
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.autoUpdate = false;   // shadow re-rendered only when the box moves
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x2b2420);
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 100);

scene.add(new THREE.HemisphereLight(0xfff4e6, 0x3a3530, 0.9));
const sun = new THREE.DirectionalLight(0xffffff, 1.9);
sun.position.set(4, 12, 7);
sun.castShadow = true;
sun.shadow.mapSize.set(isMobile ? 512 : 1024, isMobile ? 512 : 1024);
Object.assign(sun.shadow.camera, { left: -8, right: 8, top: 8, bottom: -8, near: 4, far: 26 });
sun.shadow.bias = -0.0004;
sun.shadow.radius = 4;
scene.add(sun);

const aniso = renderer.capabilities.getMaxAnisotropy();
function tex(canvas, repeatX = 1, repeatY = 1) {
  const t = new THREE.CanvasTexture(canvas);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = aniso;
  if (repeatX !== 1 || repeatY !== 1) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeatX, repeatY); }
  return t;
}

const WALL_Z = -5, SIDE_X = 7, FRONT_Z = 4.5;

// floor
const floor = new THREE.Mesh(new THREE.PlaneGeometry(40, 30),
  new THREE.MeshLambertMaterial({ map: tex(drawFloor(), 8, 6) }));
floor.rotation.x = -Math.PI / 2;
floor.position.z = 10;
floor.receiveShadow = true;
scene.add(floor);

// brick wall
const wall = new THREE.Mesh(new THREE.PlaneGeometry(40, 16),
  new THREE.MeshLambertMaterial({ map: tex(drawBricks(), 40 / 6, 16 / 5.6) }));
wall.position.set(0, 8, WALL_Z);
wall.receiveShadow = true;
scene.add(wall);

// skirting shadow where wall meets floor
const skirt = new THREE.Mesh(new THREE.PlaneGeometry(40, 0.6),
  new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.25 }));
skirt.rotation.x = -Math.PI / 2; skirt.position.set(0, 0.002, WALL_Z + 0.3);
scene.add(skirt);
for (const m of [floor, wall, skirt]) { m.updateMatrix(); m.matrixAutoUpdate = false; }

// matchbox (width x, thickness y, length z) – proportions of a real box
const BW = 1.6, BH = 0.725, BL = 2.7;
const mat = (c) => new THREE.MeshStandardMaterial({ map: tex(c), roughness: 0.6 });
const strikerMat = mat(drawStriker()), endMat = mat(drawEnd());
// BoxGeometry material order: +x, -x, +y, -y, +z, -z
const boxMesh = new THREE.Mesh(new THREE.BoxGeometry(BW, BH, BL),
  [strikerMat, strikerMat, mat(drawFront()), mat(drawBack()), endMat, endMat]);
boxMesh.castShadow = true;
scene.add(boxMesh);

/* =========================================================
   Physics
   ========================================================= */
const world = new CANNON.World({ gravity: new CANNON.Vec3(0, -25, 0) });
world.broadphase = new CANNON.NaiveBroadphase();
world.defaultContactMaterial.friction = 0.4;
world.defaultContactMaterial.restitution = 0.25;
world.solver.iterations = 10;
world.allowSleep = true;          // lets the box come fully to rest instead of micro-jittering

function staticPlane(pos, euler) {
  const b = new CANNON.Body({ mass: 0, shape: new CANNON.Plane() });
  b.position.set(...pos);
  b.quaternion.setFromEuler(...euler);
  world.addBody(b);
}
staticPlane([0, 0, 0], [-Math.PI / 2, 0, 0]);               // floor
staticPlane([0, 0, WALL_Z], [0, 0, 0]);                    // back wall (faces +z)
staticPlane([0, 0, FRONT_Z], [0, Math.PI, 0]);             // invisible front
staticPlane([-SIDE_X, 0, 0], [0, Math.PI / 2, 0]);         // invisible left
staticPlane([SIDE_X, 0, 0], [0, -Math.PI / 2, 0]);         // invisible right

const body = new CANNON.Body({
  mass: 1, shape: new CANNON.Box(new CANNON.Vec3(BW / 2, BH / 2, BL / 2)),
  linearDamping: 0.05, angularDamping: 0.12,
});
body.position.set(0, BH / 2, 0);
body.quaternion.setFromEuler(0, 0.35, 0);
body.allowSleep = true;
body.sleepSpeedLimit = 0.2;
body.sleepTimeLimit = 0.25;
world.addBody(body);

/* =========================================================
   Game logic
   ========================================================= */
const $ = (id) => document.getElementById(id);
let state = 'ready', throwTime = 0, stillTime = 0;
let total = 0, throws = 0, best = 0;
const rand = (a, b) => a + Math.random() * (b - a);

/* =========================================================
   Sound effects (synthesized with Web Audio – no files)
   ========================================================= */
const sfx = (() => {
  let ctx = null, master = null, noiseBuf = null, muted = false, lastHit = 0;
  function init() {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    master = ctx.createGain(); master.gain.value = 0.8; master.connect(ctx.destination);
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  const ready = () => ctx && !muted;
  function noise(dur) { const s = ctx.createBufferSource(); s.buffer = noiseBuf; s.loop = true; s.start(); s.stop(ctx.currentTime + dur + 0.05); return s; }
  function env(gainNode, t, peak, attack, decay) {
    gainNode.gain.setValueAtTime(0.0001, t);
    gainNode.gain.exponentialRampToValueAtTime(peak, t + attack);
    gainNode.gain.exponentialRampToValueAtTime(0.0001, t + attack + decay);
  }
  function tone(freq, t, dur, vol, type = 'sine') {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    env(g, t, vol, 0.01, dur); o.connect(g).connect(master);
    o.start(t); o.stop(t + dur + 0.05);
  }
  return {
    init,
    toggle() { muted = !muted; return muted; },
    whoosh(power) {                         // throw
      if (!ready()) return;
      const t = ctx.currentTime, dur = 0.35 + power * 0.25;
      const src = noise(dur), bp = ctx.createBiquadFilter(), g = ctx.createGain();
      bp.type = 'bandpass'; bp.Q.value = 1.2;
      bp.frequency.setValueAtTime(400, t);
      bp.frequency.exponentialRampToValueAtTime(1800 + power * 1600, t + dur * 0.45);
      bp.frequency.exponentialRampToValueAtTime(600, t + dur);
      env(g, t, 0.35 + power * 0.35, 0.06, dur);
      src.connect(bp).connect(g).connect(master);
    },
    hit(speed, isWall) {                    // cardboard box hitting floor / wall
      if (!ready()) return;
      const now = performance.now();
      if (now - lastHit < 45) return;
      lastHit = now;
      const t = ctx.currentTime, v = Math.min(1, speed / 9);
      // papery tap
      const src = noise(0.12), lp = ctx.createBiquadFilter(), g = ctx.createGain();
      lp.type = 'lowpass'; lp.frequency.value = (isWall ? 2600 : 1700) + v * 1500;
      env(g, t, 0.15 + v * 0.6, 0.002, 0.07 + v * 0.05);
      src.connect(lp).connect(g).connect(master);
      // hollow body thump
      const o = ctx.createOscillator(), og = ctx.createGain();
      o.frequency.setValueAtTime((isWall ? 220 : 150) + v * 40, t);
      o.frequency.exponentialRampToValueAtTime(70, t + 0.12);
      env(og, t, 0.1 + v * 0.45, 0.003, 0.12);
      o.connect(og).connect(master); o.start(t); o.stop(t + 0.2);
      // faint rattle of matchsticks inside
      if (v > 0.25) {
        const r = noise(0.1), hp = ctx.createBiquadFilter(), rg = ctx.createGain();
        hp.type = 'highpass'; hp.frequency.value = 3500;
        env(rg, t + 0.015, 0.05 + v * 0.12, 0.004, 0.08);
        r.connect(hp).connect(rg).connect(master);
      }
    },
    result(pts) {
      if (!ready()) return;
      const t = ctx.currentTime + 0.05;
      if (pts === 100) {                    // fanfare
        [523, 659, 784, 1047].forEach((f, i) => tone(f, t + i * 0.09, 0.35, 0.22, 'triangle'));
        tone(1568, t + 0.38, 0.6, 0.12, 'sine');
        tone(2093, t + 0.44, 0.6, 0.08, 'sine');
      } else if (pts === 50) {              // pleasant two-note chime
        tone(659, t, 0.3, 0.22, 'triangle');
        tone(988, t + 0.12, 0.45, 0.2, 'triangle');
      } else {                              // flat: soft "womp"
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = 'sawtooth'; o.frequency.setValueAtTime(220, t);
        o.frequency.exponentialRampToValueAtTime(110, t + 0.4);
        const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 700;
        env(g, t, 0.16, 0.02, 0.45);
        o.connect(lp).connect(g).connect(master); o.start(t); o.stop(t + 0.55);
      }
    },
  };
})();

body.addEventListener('collide', (e) => {
  const speed = Math.abs(e.contact.getImpactVelocityAlongNormal());
  if (speed > 0.7) sfx.hit(speed, e.body.position.z !== 0 || e.body.position.x !== 0);
});

function throwBox(power, dx = 0) {
  if (state !== 'ready') return;
  state = 'flying'; throwTime = performance.now(); stillTime = 0;
  sfx.init(); sfx.whoosh(power);
  $('hint').classList.add('hide');
  $('popup').classList.remove('show');
  body.wakeUp();
  const p = body.position;
  body.position.y += 0.05;
  body.velocity.set(-p.x * 0.6 + dx * 6 + rand(-0.6, 0.6), 9 + power * 8, -p.z * 0.6 + rand(-0.6, 0.4));
  const spin = 5 + power * 13;
  body.angularVelocity.set(rand(-1, 1) * spin, rand(-1, 1) * spin * 0.6, rand(-1, 1) * spin);
  wake();
}

const UP = new CANNON.Vec3(0, 1, 0), _up = new CANNON.Vec3(), _q = new CANNON.Quaternion();
function settle() {
  state = 'ready';
  // which local axis points up?
  const up = body.quaternion.conjugate(_q).vmult(UP, _up);
  const ax = Math.abs(up.x), ay = Math.abs(up.y), az = Math.abs(up.z);
  let pts, name;
  if (az >= ax && az >= ay) { pts = 100; name = 'STANDING ON END!'; }
  else if (ax >= ay)        { pts = 50;  name = 'STRIKER SIDE'; }
  else                      { pts = 0;   name = 'FLAT'; }
  total += pts; throws++; best = Math.max(best, pts);
  sfx.result(pts);
  $('total').textContent = total;
  $('throws').textContent = throws;
  $('last').textContent = pts;
  $('best').textContent = best;
  const pop = $('popup');
  pop.innerHTML = `${pts ? '+' + pts : '0'}<small>${name}</small>`;
  pop.style.color = pts === 100 ? '#f2d214' : pts === 50 ? '#ffb27a' : '#fff';
  pop.classList.add('show');
  setTimeout(() => { if (state === 'ready') $('hint').classList.remove('hide'); }, 900);
}

$('mute').onclick = (e) => {
  e.stopPropagation(); sfx.init();
  const m = sfx.toggle();
  e.currentTarget.textContent = m ? '🔇 Muted' : '🔊 Sound';
};

$('reset').onclick = (e) => {
  e.stopPropagation();
  total = throws = best = 0;
  ['total', 'throws', 'best'].forEach(id => $(id).textContent = 0);
  $('last').textContent = '–';
  $('popup').classList.remove('show');
};

/* ---------- swipe-up input ---------- */
let start = null;
const powerBox = $('power'), powerFill = $('powerFill');
function powerFrom(dy, dt) {
  const byDist = dy / (innerHeight * 0.45);
  const bySpeed = (dy / Math.max(dt, 16)) / 2.2;
  return Math.min(1, Math.max(0.15, Math.max(byDist, bySpeed)));
}
container.addEventListener('pointerdown', (e) => {
  sfx.init(); // browsers only allow audio after a user gesture
  if (state !== 'ready') return;
  start = { x: e.clientX, y: e.clientY, t: performance.now() };
  container.setPointerCapture(e.pointerId);
});
let pendingDy = 0, barQueued = false;
container.addEventListener('pointermove', (e) => {
  if (!start) return;
  pendingDy = start.y - e.clientY;
  if (barQueued) return;
  barQueued = true;
  requestAnimationFrame(() => {
    barQueued = false;
    if (!start || pendingDy <= 10) return;
    powerBox.classList.add('on');
    powerFill.style.transform = `scaleY(${Math.min(1, pendingDy / (innerHeight * 0.45))})`;
  });
}, { passive: true });
container.addEventListener('pointerup', (e) => {
  if (!start) return;
  const dy = start.y - e.clientY, dx = (e.clientX - start.x) / innerWidth, dt = performance.now() - start.t;
  start = null;
  powerBox.classList.remove('on'); powerFill.style.transform = 'scaleY(0)';
  if (dy > 30) throwBox(powerFrom(dy, dt), dx);
});
container.addEventListener('pointercancel', () => { start = null; powerBox.classList.remove('on'); });
addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); throwBox(rand(0.55, 0.95)); }
});

/* ---------- camera ---------- */
const camLook = new THREE.Vector3(0, 1.4, -0.5);
let camY = 0, camDist = 10;
function placeCamera(dt) {          // returns true while the camera is still moving
  const target = Math.min(Math.max(body.position.y * 0.45, 0), 3.2);
  camY += (target - camY) * Math.min(1, dt * 3);
  camera.position.set(0, 4.2 + camY, camDist);
  camLook.set(body.position.x * 0.15, 1.3 + camY, -0.5);
  camera.lookAt(camLook);
  return Math.abs(target - camY) > 0.002;
}
function onResize() {
  camDist = innerHeight > innerWidth ? 13 : 10;
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  wake();
}
let resizeQueued = false;
addEventListener('resize', () => {
  if (resizeQueued) return;
  resizeQueued = true;
  requestAnimationFrame(() => { resizeQueued = false; onResize(); });
});
document.addEventListener('visibilitychange', () => { if (!document.hidden) wake(); });

/* ---------- loop: runs only while something moves, then sleeps ---------- */
let last = performance.now(), running = false, idleFrames = 0;
const lastPos = new CANNON.Vec3(), lastQuat = new CANNON.Quaternion();
function wake() {
  if (running) return;
  running = true; idleFrames = 0; last = performance.now();
  requestAnimationFrame(loop);
}
function loop(now) {
  const dt = Math.min(Math.max((now - last) / 1000, 0), 0.05); last = now;

  let moving = false;
  if (state === 'flying') {
    world.step(1 / 90, dt, 4);
    // movement measured from the real pose change per frame (ignores solver micro-jitter)
    const inv = 1 / Math.max(dt, 1e-3);
    const lin = body.position.distanceTo(lastPos) * inv;
    const dot = Math.min(1, Math.abs(lastQuat.x * body.quaternion.x + lastQuat.y * body.quaternion.y +
                                     lastQuat.z * body.quaternion.z + lastQuat.w * body.quaternion.w));
    const ang = 2 * Math.acos(dot) * inv;
    lastPos.copy(body.position); lastQuat.copy(body.quaternion);

    const onFloor = body.position.y < BL / 2 + 0.08;
    stillTime = (onFloor && lin < 0.3 && ang < 0.4) ? stillTime + dt : 0;
    const elapsed = now - throwTime;
    if (elapsed > 600 && (body.sleepState === CANNON.Body.SLEEPING || stillTime > 0.3)) settle();
    else if (elapsed > 6000) settle();   // backup so a result always shows

    boxMesh.position.copy(body.position);
    boxMesh.quaternion.copy(body.quaternion);
    renderer.shadowMap.needsUpdate = true;
    moving = true;
  }
  if (placeCamera(dt)) moving = true;
  renderer.render(scene, camera);

  // keep going a few frames after everything stops, then stop the loop (no CPU/GPU use while idle)
  idleFrames = moving ? 0 : idleFrames + 1;
  if (idleFrames > 5) { running = false; return; }
  requestAnimationFrame(loop);
}

boxMesh.position.copy(body.position);
boxMesh.quaternion.copy(body.quaternion);
renderer.shadowMap.needsUpdate = true;
$('loading').remove();
onResize();
</script>
</body>
</html>
